# SonarQube Configuration for Backend

# Project Information
sonar.projectKey=todo-backend
sonar.projectName=Todo Backend API
sonar.projectVersion=1.0

# Source Code
sonar.sources=.
sonar.sourceEncoding=UTF-8

# Exclusions
sonar.exclusions=node_modules/**,coverage/**,*.test.js,*.spec.js

# Test Coverage
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.coverage.exclusions=**/*.test.js,**/*.spec.js

# Language
sonar.language=js

# Code Smells & Issues
sonar.issue.ignore.multicriteria=e1,e2

# Ignore common TODO comments
sonar.issue.ignore.multicriteria.e1.ruleKey=javascript:S1135
sonar.issue.ignore.multicriteria.e1.resourceKey=**/*

# Ignore console.log in Node.js backend
sonar.issue.ignore.multicriteria.e2.ruleKey=javascript:S2228
sonar.issue.ignore.multicriteria.e2.resourceKey=**/*