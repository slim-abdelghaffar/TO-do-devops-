<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> - Simple & Clean</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <h1>📝  qsdqsdqsqsds</h1>
            <p class="subtitle">Stay organized, stay productivesdfsdsdsdfsdffsddsf</p>
        </header>

        <!-- Add Todo Form -->
        <div class="add-todo-section">
            <input 
                type="text" 
                id="todoInput" 
                class="todo-input" 
                placeholder="What needs to be done?"
                maxlength="255"
            >
            <button id="addBtn" class="btn btn-primary">
                <span class="btn-icon">+</span> Add Todo
            </button>
        </div>

        <!-- Stats Section -->
        <div class="stats">
            <div class="stat-item">
                <span class="stat-label">Total</span>
                <span class="stat-value" id="totalCount">0</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">Active</span>
                <span class="stat-value" id="activeCount">0</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">Completed</span>
                <span class="stat-value" id="completedCount">0</span>
            </div>
        </div>

        <!-- Loading Indicator -->
        <div id="loadingIndicator" class="loading" style="display: none;">
            <div class="spinner"></div>
            <p>Loading todos...</p>
        </div>

        <!-- Error Message -->
        <div id="errorMessage" class="error-message" style="display: none;">
            <span class="error-icon">⚠️</span>
            <span id="errorText"></span>
            <button id="retryBtn" class="btn-retry">Retry</button>
        </div>

        <!-- Empty State -->
        <div id="emptyState" class="empty-state" style="display: none;">
            <div class="empty-icon">📭</div>
            <h3>No todos yet!</h3>
            <p>Add your first todo above to get started</p>
        </div>

        <!-- Todo List -->
        <ul id="todoList" class="todo-list">
            <!-- Todos will be dynamically inserted here -->
        </ul>

        <!-- Footer -->
        <footer class="footer">
            <p>Backend API: <span id="apiStatus" class="status-badge status-checking">Checking...</span></p>
            <p class="version">v1.0.0 | Made with ❤️</p>
        </footer>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="toast">
        <span id="toastMessage"></span>
    </div>

    <script src="app.js"></script>
</body>
</html>
